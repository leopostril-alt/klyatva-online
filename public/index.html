<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Клятва Чотирьох — Онлайн</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
  :root{--bg:#070a0f;--bg2:#0e141c;--panel:#131c27;--panel2:#1a2531;--panel3:#0e161f;
    --air:#8fe0ec;--fire:#ff6a3d;--earth:#cf9a52;--water:#4d7fe0;
    --gold:#f0c674;--gold-dim:#8a7248;--text:#eef3f7;--text-dim:#8ea0b3;--danger:#e0554f;--ok:#5fcf82;--border:#22303e;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;}
  body{min-height:100vh;display:flex;justify-content:center;
    background:radial-gradient(ellipse 500px 500px at 0% 0%, rgba(240,198,116,.05), transparent),
               radial-gradient(ellipse 500px 500px at 100% 100%, rgba(77,127,224,.06), transparent), var(--bg);}
  #app{width:100%;max-width:460px;min-height:100vh;background:var(--bg2);display:flex;flex-direction:column;box-shadow:0 0 60px rgba(0,0,0,.5);}
  @media (min-width:900px){ #app{max-width:720px;} }
  #topBar{position:relative;overflow:hidden;padding:10px 14px;background:linear-gradient(180deg,var(--panel),var(--bg2));border-bottom:1px solid var(--border);transition:background 1s;}
  @keyframes driftFog{0%{transform:translateX(0);}100%{transform:translateX(-40px);}}
  .fogLayer{position:absolute;inset:0;opacity:.4;pointer-events:none;z-index:0;}
  .fogLayer svg{width:140%;height:100%;animation:driftFog 30s linear infinite alternate;}
  #topBar>*:not(.fogLayer){position:relative;z-index:1;}
  #treeRow{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  #treeWrap{flex:none;line-height:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
  #treeCaption{flex:1;min-width:0;}
  #treeStateLabel{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin-bottom:2px;}
  #roundLabel{font-family:'Cinzel',serif;font-size:12.5px;color:var(--gold);letter-spacing:.03em;}
  #resBar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:var(--text-dim);}
  #resBar b{color:var(--gold);}
  @keyframes badgeDot{0%,100%{opacity:.55;}50%{opacity:1;}}
  .phaseBadge{display:inline-flex;align-items:center;gap:6px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 11px;border-radius:20px;border:1px solid var(--gold-dim);color:var(--gold);background:rgba(240,198,116,.1);margin-bottom:8px;}
  .phaseBadge .dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:badgeDot 1.8s ease-in-out infinite;}
  .phaseBadge.fire{color:var(--fire);border-color:#7a3a24;background:rgba(255,106,61,.1);}
  .phaseBadge.water{color:var(--water);border-color:#2c4f8f;background:rgba(77,127,224,.1);}
  .phaseBadge.danger{color:var(--danger);border-color:#7a2c28;background:rgba(224,85,79,.1);}
  #topBar.tint-public{background:linear-gradient(180deg,rgba(240,198,116,.06),var(--bg2));}
  #topBar.tint-secret{background:linear-gradient(180deg,rgba(77,127,224,.08),var(--bg2));}
  #topBar.tint-fire{background:linear-gradient(180deg,rgba(255,106,61,.08),var(--bg2));}
  #topBar.tint-danger{background:linear-gradient(180deg,rgba(224,85,79,.08),var(--bg2));}
  #screen{flex:1;padding:16px;overflow-y:auto;}
  h2{font-family:'Cinzel',serif;color:var(--gold);margin:0 0 10px;font-size:19px;font-weight:700;letter-spacing:.01em;}
  h3{font-family:'Cinzel',serif;color:var(--text);margin:16px 0 6px;font-size:13.5px;font-weight:600;}
  p{line-height:1.5;font-size:14px;}
  .muted{color:var(--text-dim);font-size:12.5px;}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
  .ornDivider{display:flex;align-items:center;gap:10px;margin:16px 0 10px;color:var(--gold-dim);}
  .ornDivider::before,.ornDivider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);}
  .sectionTtl{font-family:'Cinzel',serif;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-dim);margin:14px 0 8px;border-bottom:1px solid var(--border);padding-bottom:6px;}
  .witnessQuote{font-style:italic;color:var(--text-dim);font-size:13.5px;line-height:1.6;position:relative;padding-left:18px;margin:10px 0;}
  .witnessQuote .qmark{position:absolute;left:-2px;top:-6px;font-size:26px;color:var(--gold-dim);font-family:Georgia,serif;}
  .witnessQuote .src{display:block;margin-top:4px;font-style:normal;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dim);}
  .textIn,.formIn{width:100%;padding:11px 12px;margin:0 0 10px;border-radius:9px;background:var(--panel3);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:14px;}
  .act{width:100%;padding:12px;margin:0 0 10px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-family:'Cinzel',serif;font-size:13px;letter-spacing:.03em;cursor:pointer;transition:.15s;}
  .act:hover{border-color:var(--gold-dim);}
  .act:disabled{opacity:.4;cursor:not-allowed;}
  @keyframes btnGlowPulse{0%,100%{box-shadow:0 0 0 rgba(240,198,116,0);}50%{box-shadow:0 0 16px rgba(240,198,116,.35);}}
  .act.primary{background:linear-gradient(180deg,#2a2113,var(--panel2));border-color:var(--gold);color:var(--gold);animation:btnGlowPulse 2.8s ease-in-out infinite;}
  .act.danger{background:rgba(224,85,79,.12);border-color:var(--danger);color:#ff9d8f;}
  .act.small{width:auto;padding:6px 12px;margin:0;font-size:11px;}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .playerRow{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13.5px;}
  .playerRow:last-child{border-bottom:none;}
  .sigilRow{display:flex;align-items:center;gap:10px;}
  .sigilRow svg{width:24px;height:24px;flex:none;}
  .sigilBig{display:flex;justify-content:center;margin:6px 0 14px;}
  .sigilBig svg{width:80px;height:80px;}
  @keyframes sigSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  @keyframes sigSpinRev{from{transform:rotate(0deg);}to{transform:rotate(-360deg);}}
  @keyframes sigBreathe{0%,100%{filter:drop-shadow(0 0 2px var(--gc));}50%{filter:drop-shadow(0 0 7px var(--gc));}}
  .casteTag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:.03em;}
  .casteTag svg{width:14px;height:14px;}
  .casteTag.air{color:var(--air);background:rgba(143,224,236,.1);border:1px solid rgba(143,224,236,.35);}
  .casteTag.fire{color:var(--fire);background:rgba(255,106,61,.1);border:1px solid rgba(255,106,61,.35);}
  .casteTag.earth{color:var(--earth);background:rgba(207,154,82,.1);border:1px solid rgba(207,154,82,.35);}
  .casteTag.water{color:var(--water);background:rgba(77,127,224,.1);border:1px solid rgba(77,127,224,.35);}
  .goalBox{background:rgba(240,198,116,.05);border:1px dashed var(--gold-dim);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px;}
  .unboundBox{background:rgba(224,85,79,.06);border-color:rgba(224,85,79,.4);}
  .abilityBox{background:var(--panel3);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px;}
  .allyChip{display:inline-block;background:var(--panel3);border:1px solid var(--border);border-radius:20px;padding:2px 10px;margin:2px 3px 2px 0;font-size:11.5px;}
  .unboundChip{border-color:rgba(224,85,79,.4);color:#ff9d8f;}
  .tokenPill{display:inline-block;padding:6px 14px;border-radius:20px;font-family:'Cinzel',serif;font-size:13px;background:var(--panel3);border:1px solid var(--border);color:var(--gold);}
  .exposedRow{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;}
  .flameIcon{width:18px;height:18px;flex:none;}
  .exposedCard{border-color:rgba(255,106,61,.4);}
  @keyframes exposeGlow{0%,100%{box-shadow:0 0 0 rgba(255,106,61,0);}50%{box-shadow:0 0 18px rgba(255,106,61,.25);}}
  .exposedCard{animation:exposeGlow 2.4s ease-in-out infinite;}
  .waitTag{font-size:11px;color:var(--text-dim);}
  .decidedTag{font-size:11px;color:var(--ok);}
  .shopItem{background:var(--panel3);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
  .roomCode{font-family:'Cinzel',serif;font-size:32px;letter-spacing:.25em;color:var(--gold);text-align:center;padding:14px 0;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1a2531;border:1px solid #f0c674;color:#f0c674;padding:9px 18px;border-radius:20px;font-size:13px;z-index:99;font-family:'Manrope',sans-serif;transition:opacity .3s;max-width:90vw;text-align:center;}
  .ccWrap{position:relative;width:100%;aspect-ratio:1/1;max-width:320px;margin:0 auto;}
  .ccCenter{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;}
  .ccNode{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:10px;color:var(--text-dim);width:56px;}
  .ccNode svg{width:26px;height:26px;}
  @keyframes accusePulse{0%,100%{filter:drop-shadow(0 0 2px var(--danger));}50%{filter:drop-shadow(0 0 9px var(--danger));}}
  .ccNode.top svg{animation:accusePulse 1.6s ease-in-out infinite;}
  @keyframes cardIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  #screen>*{animation:cardIn .4s ease-out both;}
</style>
</head>
<body>
<div id="app">
  <div id="topBar" style="display:none;">
    <div class="fogLayer"><svg viewBox="0 0 200 100" preserveAspectRatio="none"><path d="M0,70 Q40,55 80,70 T160,70 T240,70 V100 H0Z" fill="rgba(255,255,255,.03)"/></svg></div>
    <span class="phaseBadge" id="phaseBadge" style="display:none;"><span class="dot"></span><span id="phaseBadgeText">—</span></span>
    <div id="treeRow">
      <div id="treeWrap"></div>
      <div id="treeCaption">
        <div id="treeStateLabel">—</div>
        <div id="roundLabel">—</div>
      </div>
    </div>
    <div id="resBar" style="display:none;"></div>
  </div>
  <div id="screen"></div>
</div>
<script>
/* ================= З'ЄДНАННЯ ================= */
const socket = io();
let pub = null;   // останній публічний стан кімнати
let priv = null;  // останній приватний стан МЕНЕ
let session = JSON.parse(localStorage.getItem('klyatvaSession') || 'null');
let uiScreen = 'start'; // start | prologue | rules | createJoin
let joinError = '';

function saveSession(s){ session = s; localStorage.setItem('klyatvaSession', JSON.stringify(s)); }
function clearSession(){ session = null; localStorage.removeItem('klyatvaSession'); }

socket.on('connect', ()=>{
  if(session && session.code && session.playerToken){
    socket.emit('rejoin', {code:session.code, playerToken:session.playerToken}, (res)=>{
      if(res.ok){ saveSession({code:res.code, playerToken:res.playerToken, playerId:res.playerId}); }
      else { clearSession(); uiScreen='start'; render(); }
    });
  }
});
socket.on('publicState', (s)=>{ pub = s; render(); });
socket.on('privateState', (s)=>{ priv = s; render(); });
socket.on('toast', (msg)=>{ toast(msg); });

function toast(msg){
  let t = document.getElementById('toastEl');
  if(!t){ t=document.createElement('div'); t.id='toastEl'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity='1';
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>{ t.style.opacity='0'; }, 2200);
}

/* ================= ВІБРАЦІЯ (де підтримується — Android; на iOS Safari тихо не діє) ================= */
function vibe(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }
const VIBE = {
  confirm: [40],
  phaseChange: [30,60,30],
  exposed: [120,60,120,60,180],
  invite: [40,80,40,80,40,80,200],
  exiled: [200,80,200],
  voteCast: [30],
  winFaithful: [50,50,50,50,50,50,250],
  winUnbound: [250,100,250],
};
let lastPhaseSeen = null, lastExposedSeenRound = -1, lastInviteSeen = false, lastResultSeen = null;
function checkVibeTriggers(){
  if(!pub) return;
  if(pub.phase !== lastPhaseSeen){
    if(lastPhaseSeen!==null) vibe(VIBE.phaseChange);
    lastPhaseSeen = pub.phase;
  }
  if(pub.phase==='reveal' && priv && priv.exposedThisRound && pub.round!==lastExposedSeenRound){
    vibe(VIBE.exposed); lastExposedSeenRound = pub.round;
  }
  if(priv && priv.myInviteOffer && !lastInviteSeen){ vibe(VIBE.invite); lastInviteSeen = true; }
  if(!priv || !priv.myInviteOffer) lastInviteSeen = false;
  if(pub.phase==='voteResult' && pub.voteResult && priv && pub.voteResult===priv.id && lastResultSeen!=='exiled_'+pub.round){
    vibe(VIBE.exiled); lastResultSeen = 'exiled_'+pub.round;
  }
  if(pub.phase==='end' && lastResultSeen!=='end'){
    vibe(pub.result==='faithful' ? VIBE.winFaithful : VIBE.winUnbound);
    lastResultSeen = 'end';
  }
}

/* ================= ДЕРЕВО РІВНОВАГИ ================= */
function lerp(a,b,t){ return a+(b-a)*t; }
function lerpColor(c1,c2,t){ return `rgb(${Math.round(lerp(c1[0],c2[0],t))},${Math.round(lerp(c1[1],c2[1],t))},${Math.round(lerp(c1[2],c2[2],t))})`; }
const COLOR_CHAOS=[24,9,12], COLOR_DULL=[150,152,157], COLOR_GOLD=[255,207,92];
function renderTree(meter, size){
  size = size||46;
  const t = Math.max(0,Math.min(100,meter))/100;
  let canopyColor, glowColor, chaosIntensity=0, idealIntensity=0;
  if(t<0.5){ const k=t/0.5; canopyColor=lerpColor(COLOR_CHAOS,COLOR_DULL,k); glowColor=`rgba(224,85,79,${(0.15+(1-k)*0.55).toFixed(2)})`; chaosIntensity=1-k; }
  else { const k=(t-0.5)/0.5; canopyColor=lerpColor(COLOR_DULL,COLOR_GOLD,k); glowColor=`rgba(240,198,116,${(0.15+k*0.65).toFixed(2)})`; idealIntensity=k; }
  const blotchSpots=[[38,48],[62,58],[50,36],[30,64],[68,40]];
  const blotchCount=Math.round(chaosIntensity*4.2);
  let blotchesHtml='';
  for(let i=0;i<blotchCount;i++){ const [bx,by]=blotchSpots[i%blotchSpots.length]; const op=(0.35+0.4*chaosIntensity).toFixed(2); blotchesHtml+=`<ellipse cx="${bx}" cy="${by}" rx="${9+i*1.2}" ry="${7+i}" fill="rgba(9,3,5,.88)" opacity="${op}"/>`; }
  let raysHtml='';
  if(idealIntensity>0.03){ const rays=[]; for(let i=0;i<8;i++){ const ang=i*45*Math.PI/180; const x2=50+Math.cos(ang)*46, y2=50+Math.sin(ang)*46; rays.push(`<line x1="50" y1="50" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="rgba(240,198,116,${(0.3+idealIntensity*0.6).toFixed(2)})" stroke-width="1.6" stroke-linecap="round"/>`); } raysHtml=`<g opacity="${idealIntensity.toFixed(2)}">${rays.join('')}</g>`; }
  return `<svg width="${size}" height="${size*1.14}" viewBox="0 0 100 120">
    ${raysHtml}
    <circle cx="50" cy="46" r="30" fill="${glowColor}" opacity=".5"/>
    <path d="M50,118 C48,100 47,90 44,80 C40,84 34,86 28,84 C34,80 38,74 40,66 C33,68 26,66 22,60 C30,60 36,56 39,49 M50,118 C52,100 53,90 56,80 C60,84 66,86 72,84 C66,80 62,74 60,66 C67,68 74,66 78,60 C70,60 64,56 61,49" stroke="#2a2119" stroke-width="2" fill="none" stroke-linecap="round" opacity=".85"/>
    <path d="M47,118 L48.5,72 L51.5,72 L53,118 Z" fill="#2a2119"/>
    <circle cx="50" cy="46" r="21" fill="${canopyColor}"/>
    <circle cx="31" cy="57" r="15" fill="${canopyColor}"/>
    <circle cx="69" cy="57" r="15" fill="${canopyColor}"/>
    <circle cx="38" cy="34" r="14" fill="${canopyColor}"/>
    <circle cx="62" cy="34" r="14" fill="${canopyColor}"/>
    <circle cx="50" cy="24" r="13" fill="${canopyColor}"/>
    ${blotchesHtml}
  </svg>`;
}

/* ================= РУНИ ================= */
function hashStr(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h)+s.charCodeAt(i); h=h|0; } return Math.abs(h); }
const CASTE_COLORS = { air:'#8fe0ec', fire:'#ff6a3d', earth:'#cf9a52', water:'#4d7fe0' };
const CASTE_NAMES = { air:'Вітрокрилі', fire:'Жаротворці', earth:"Кам'яни", water:'Плинні' };
const CASTE_ICON_PATH = {
  air:'<path d="M4 9c3-2.4 5-2.4 8 0s5 2.4 8 0" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>',
  fire:'<path d="M12 2.5c1.2 4-2.6 5.3-2.6 9.2a2.6 2.6 0 0 0 5.2 0c0-1.7-.9-2.6-.9-4.3 1.8 1 2.8 3.4 2.8 5.2A4.5 4.5 0 0 1 7.5 12.6c0-4.4 2.7-5.7 4.5-10.1z" fill="currentColor"/>',
  earth:'<polygon points="12,3 20,20 4,20" fill="currentColor"/>',
  water:'<path d="M12 2.8c4 5.2 7 9.3 7 12.4a7 7 0 0 1-14 0c0-3.1 3-7.2 7-12.4z" fill="currentColor"/>',
};
function casteIcon(key){ return `<svg viewBox="0 0 24 24">${CASTE_ICON_PATH[key]}</svg>`; }
const RUNES = [
  (c)=>`<circle cx="7" cy="7" r="4.2" fill="none" stroke="${c}" stroke-width="1.1"/><circle cx="7" cy="7" r="1.1" fill="${c}"/>`,
  (c)=>`<line x1="3" y1="3" x2="11" y2="11" stroke="${c}" stroke-width="1.3"/><line x1="11" y1="3" x2="3" y2="11" stroke="${c}" stroke-width="1.3"/>`,
  (c)=>`<polygon points="7,2.5 12,11 2,11" fill="none" stroke="${c}" stroke-width="1.1"/>`,
  (c)=>`<polygon points="7,2 12,7 7,12 2,7" fill="none" stroke="${c}" stroke-width="1.1"/>`,
  (c)=>`<line x1="3" y1="4.5" x2="11" y2="4.5" stroke="${c}" stroke-width="1.2"/><line x1="3" y1="9.5" x2="11" y2="9.5" stroke="${c}" stroke-width="1.2"/>`,
  (c)=>`<path d="M2.5 8.5A5 5 0 0 1 11.5 8.5" fill="none" stroke="${c}" stroke-width="1.2" stroke-linecap="round"/>`,
  (c)=>`<path d="M7 2 8.3 5.7 12 7 8.3 8.3 7 12 5.7 8.3 2 7 5.7 5.7Z" fill="${c}"/>`,
  (c)=>`<polyline points="2.5,4 6,10 8,5 11.5,10" fill="none" stroke="${c}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>`,
  (c)=>`<rect x="3" y="3" width="8" height="8" fill="none" stroke="${c}" stroke-width="1.1"/>`,
  (c)=>`<line x1="7" y1="2.5" x2="7" y2="11.5" stroke="${c}" stroke-width="1.2"/><line x1="2.5" y1="7" x2="11.5" y2="7" stroke="${c}" stroke-width=".8" opacity=".6"/>`,
  (c)=>`<path d="M2.5 6c1.5-2 2.5-2 4 0s2.5 2 4 0" stroke="${c}" stroke-width="1.2" fill="none" stroke-linecap="round"/>`,
  (c)=>`<polygon points="7,12 12,3 2,3" fill="none" stroke="${c}" stroke-width="1.1"/>`,
];
function neutralRune(name, size){ size=size||24; const h=hashStr(name); const idx=h%RUNES.length; return `<svg width="${size}" height="${size}" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.4" fill="#0e141c" stroke="var(--gold-dim)" stroke-width="1"/>${RUNES[idx]('var(--gold)')}</svg>`; }
function fullSigil(name, caste, size){
  size=size||64; const h=hashStr(name); const c=CASTE_COLORS[caste];
  const spinDir = h%2===0?'sigSpin':'sigSpinRev'; const spinDur=(8+h%6).toFixed(1);
  let inner='';
  if(caste==='air') inner = `<path d="M6 15c3-2.4 5-2.4 8 0s5 2.4 8 0" stroke="${c}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  if(caste==='fire') inner = `<path d="M15 6c1.6 5-3.4 6.6-3.4 11.4a3.4 3.4 0 006.8 0c0-2.2-1.2-3.4-1.2-5.6 2.4 1.3 3.7 4.5 3.7 6.8a6.1 6.1 0 01-12.2 0C8.7 12.4 12.5 10.4 15 6z" fill="${c}"/>`;
  if(caste==='earth') inner = `<polygon points="15,7 21,20 9,20" fill="${c}"/>`;
  if(caste==='water') inner = `<path d="M15 6c3.3 4.4 5.8 7.9 5.8 10.5a5.8 5.8 0 01-11.6 0C9.2 13.9 11.7 10.4 15 6z" fill="${c}"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 30 30" style="--gc:${c};animation:sigBreathe 3s ease-in-out infinite;">
    <circle cx="15" cy="15" r="13.5" fill="none" stroke="${c}" stroke-width="1" opacity=".3"/>
    <g style="transform-origin:15px 15px;animation:${spinDir} ${spinDur}s linear infinite;"><circle cx="15" cy="15" r="11.5" fill="none" stroke="${c}" stroke-width=".6" stroke-dasharray="1.5 3" opacity=".5"/></g>
    ${inner}
  </svg>`;
}

function ornDivider(){ return `<div class="ornDivider"></div>`; }
function sectionTtl(text){ return `<div class="sectionTtl">${text}</div>`; }
function witnessQuoteHtml(text){ return `<div class="witnessQuote"><span class="qmark">"</span>${text}<span class="src">Свідок Клятви</span></div>`; }
function setPhaseBadge(label, tone){
  const el = document.getElementById('phaseBadge');
  const topBarEl = document.getElementById('topBar');
  if(!label){ el.style.display='none'; topBarEl.className=''; return; }
  el.style.display='inline-flex';
  el.className = 'phaseBadge' + (tone?(' '+tone):'');
  document.getElementById('phaseBadgeText').textContent = label;
  topBarEl.className = tone==='fire' ? 'tint-fire' : tone==='danger' ? 'tint-danger' : tone==='water' ? 'tint-secret' : 'tint-public';
}
function screen(html){ document.getElementById('screen').innerHTML = html; }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function doCreate(){
  const name = document.getElementById('createNameIn').value;
  socket.emit('createRoom', {name}, (res)=>{
    if(!res.ok){ joinError=res.msg; render(); return; }
    saveSession({code:res.code, playerToken:res.playerToken, playerId:res.playerId});
    joinError='';
  });
}
function doJoin(){
  const code = document.getElementById('joinCodeIn').value;
  const name = document.getElementById('joinNameIn').value;
  socket.emit('joinRoom', {code, name}, (res)=>{
    if(!res.ok){ joinError=res.msg; render(); return; }
    saveSession({code:res.code, playerToken:res.playerToken, playerId:res.playerId});
    joinError='';
  });
}
function leaveRoom(){ clearSession(); pub=null; priv=null; uiScreen='start'; location.reload(); }

  const remain = Math.max(0, Math.ceil((pub.regTimerEnd - Date.now())/1000));
  const m = Math.floor(remain/60), s=String(remain%60).padStart(2,'0');
  return `${m}:${s}`;
}

function confirmAction(){
  const val = (id)=>{ const el=document.getElementById(id); return el?el.value:''; };

    realChoice: val('realSel')||'give',
    abilityTarget: val('abilitySel')||null,
    useShield: val('shieldSel')==='yes',
    strikeTarget: val('strikeSel')||null,
    silenceTarget: val('silenceSel')||null,
    slanderTarget: val('slanderSel')||null,
    breathUsed: val('breathSel')==='yes',
    inviteTarget: val('inviteSel')||null,
  };
  socket.emit('submitSecretAction', action);
  vibe(VIBE.confirm);
}

    ${priv.struckThisRound? `<div class="card"><p class="exposedRow">⚔ Твоє Слово цього раунду спалено Ударом Розбрату — не зараховано нічого.</p></div>` : ''}
    ${priv.exposedThisRound? `<div class="card exposedCard"><p class="exposedRow">Тебе викрили — Жаротворці розпалили правду: ти взяв(ла) Слово собі! −1 Жетон.</p></div>`:''}
    ${pub.struckThisRound.length? `<div class="card">${pub.struckThisRound.map(id=>`<div class="exposedRow">⚔ ${esc(pub.players.find(p=>p.id===id).name)} — Слово спалено Ударом Розбрату.</div>`).join('')}</div>`:''}
    ${hasExposure? `<div class="card exposedCard"><p class="witnessQuote" style="margin:0 0 8px;">${esc(pub.witness.exposure||'')}</p>${pub.exposedThisRound.map(id=>`<div class="exposedRow"><svg class="flameIcon" viewBox="0 0 24 24"><path d="M12 2.5c1.2 4-2.6 5.3-2.6 9.2a2.6 2.6 0 0 0 5.2 0c0-1.7-.9-2.6-.9-4.3 1.8 1 2.8 3.4 2.8 5.2A4.5 4.5 0 0 1 7.5 12.6c0-4.4 2.7-5.7 4.5-10.1z" fill="var(--fire)"/></svg>${esc(pub.players.find(p=>p.id===id).name)} узяв(ла) Слово собі — Жаротворці розкрили це прилюдно!</div>`).join('')}</div>` : ''}
    ${pub.debtPlayers.length? `<p class="muted">Борг Безладу торкнувся: ${pub.debtPlayers.map(id=>esc(pub.players.find(p=>p.id===id).name)).join(', ')}.</p>` : ''}
    ${isHost? `<button class="act primary" onclick="socket.emit('proceedAfterReveal')">Далі →</button>` : `<p class="muted" style="text-align:center;">Хост переходить далі…</p>`}
  `);
}

/* ================= ЗАКЛИК У ТІНЬ ================= */
function renderInvite(){
  setPhaseBadge('Тінь кличе','danger');
  document.getElementById('roundLabel').textContent = 'Хтось приймає рішення';
  document.getElementById('treeWrap').innerHTML = renderTree(pub.meter,44);
  const isHost = priv && priv.isHost;
  if(priv.myInviteOffer){
    screen(`
      <div class="card" style="text-align:center;">${renderTree(pub.meter,90)}</div>
      <div class="goalBox unboundBox"><b>Тобі щось таємно пропонують.</b><p style="margin:8px 0 0;">Хтось із тих, хто вже давно не промовляє Клятву чесно, кличе тебе приєднатися. Погодишся — дізнаєшся, хто ще з ними, отримаєш від них жетони на початок і надалі діятимеш як вони. Відмовишся — усе лишиться, як було.</p></div>
      <button class="act primary" onclick="socket.emit('respondInvite',{answer:'yes'})">Погодитись</button>
      <button class="act" onclick="socket.emit('respondInvite',{answer:'no'})">Відмовитись</button>
    `);
    return;
  }
  screen(`
    <div class="card" style="text-align:center;">${renderTree(pub.meter,90)}</div>
    ${witnessQuoteHtml(pub.witness.invite||'')}
    <div class="card"><p class="muted">Хтось із гравців зараз наодинці приймає рішення, про яке ніхто інший не дізнається. Зачекайте.</p></div>
    ${isHost? `<button class="act primary" ${pub.inviteAnswer?'':'disabled'} onclick="socket.emit('proceedAfterInvite')">Далі →</button>` : ''}
  `);
}

/* ================= СУД КЛЯТВИ (ГОЛОСУВАННЯ) ================= */
function buildCouncilCircle(containerId){
  const el = document.getElementById(containerId); if(!el) return;
  const alive = pub.players.filter(p=>p.alive);
  const votes = Object.entries(pub.votesCast||{});
  const voteCounts = pub.voteTally||{};
  let topId=null, topV=0;
  Object.entries(voteCounts).forEach(([id,v])=>{ if(v>topV){topV=v; topId=id;} });
  const n = alive.length;
  const W = el.clientWidth || 300;
  const cx=W/2, cy=W/2;
  const useDouble = n>10;
  const innerCount = useDouble ? Math.ceil(n/2) : n;
  const outerCount = n - innerCount;
  const rInner = useDouble ? W*0.22 : W*0.36;
  const rOuter = W*0.44;
  let nodesHtml='', linesHtml='';
  const pos = {};
  alive.forEach((p,i)=>{
    let r, idx, count, angOffset=0;
    if(!useDouble || i<innerCount){ r=rInner; idx=i; count=innerCount; }
    else { r=rOuter; idx=i-innerCount; count=outerCount; angOffset=Math.PI/outerCount; }
    const ang = angOffset + (idx/count)*Math.PI*2 - Math.PI/2;
    const x = cx + Math.cos(ang)*r, y = cy + Math.sin(ang)*r;
    pos[p.id] = {x,y};
    const isTop = p.id===topId && topV>0;
    nodesHtml += `<div class="ccNode ${isTop?'top':''}" style="left:${x}px;top:${y}px;">${neutralRune(p.name,26)}<div>${esc(p.name)}${voteCounts[p.id]?` (${voteCounts[p.id]})`:''}</div></div>`;
  });
  votes.forEach(([voterId,targetId])=>{
    const a = pos[voterId], b = pos[targetId];
    if(!a||!b) return;
    linesHtml += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--gold-dim)" stroke-width="1" opacity=".45" marker-end="url(#ccArrow)"/>`;
  });
  el.innerHTML = `<svg width="${W}" height="${W}" style="position:absolute;top:0;left:0;pointer-events:none;"><defs><marker id="ccArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--gold-dim)"/></marker></defs>${linesHtml}</svg>
    <div class="ccCenter">${renderTree(pub.meter,44)}</div>
    ${nodesHtml}`;
}
function renderVote(){
  setPhaseBadge('Суд Клятви','danger');
  document.getElementById('roundLabel').textContent = 'Голосування';
  document.getElementById('treeWrap').innerHTML = renderTree(pub.meter,44);
  const alive = pub.players.filter(p=>p.alive);
  const myVote = pub.votesCast ? pub.votesCast[priv.id] : null;
  screen(`
    ${witnessQuoteHtml(pub.witness.vote||'')}
    <div class="ccWrap" id="councilWrap"></div>
    ${ornDivider()}
    ${sectionTtl('Кого вигнати?')}
    <div class="card">${alive.map(p=>`<button class="act ${myVote===p.id?'primary':''}" onclick="castVote('${p.id}')">${esc(p.name)}${pub.voteTally && pub.voteTally[p.id]?` — ${pub.voteTally[p.id]} голос(ів)`:''}</button>`).join('')}</div>
    <p class="muted" style="text-align:center;">Можеш змінити голос, доки не проголосують усі.</p>
  `);
  buildCouncilCircle('councilWrap');
}
function castVote(targetId){ socket.emit('castVote', {targetId}); vibe(VIBE.voteCast); }

/* ================= ВИРОК ================= */
function renderVoteResult(){
  setPhaseBadge('Вирок винесено','danger');
  document.getElementById('roundLabel').textContent = `Раунд ${pub.round} / ${pub.maxRounds}`;
  document.getElementById('treeWrap').innerHTML = renderTree(pub.meter,44);
  const isHost = priv && priv.isHost;
  const target = pub.voteResult ? pub.players.find(p=>p.id===pub.voteResult) : null;
  screen(`
    <div class="card" style="text-align:center;">${renderTree(pub.meter,90)}</div>
    ${witnessQuoteHtml(pub.witness.voteResult||'')}
    <div class="card" style="text-align:center;">
      ${target ? `<p><span class="sigilRow" style="justify-content:center;">${neutralRune(target.name,30)}<b>${esc(target.name)}</b></span> вигнан${target.name.endsWith('а')?'а':'ий'} з кола.</p><p class="muted">${pub.voteWasUnbound? 'Це був Розв\'язаний — Рівновага зміцніла.' : 'Це був Вірний — Рівновага похитнулась.'}</p>` : `<p class="muted">Голоси розділились порівну — цього разу нікого не вигнано.</p>`}
    </div>
    ${isHost? `<button class="act primary" onclick="socket.emit('proceedAfterVoteResult')">Далі →</button>` : `<p class="muted" style="text-align:center;">Хост переходить далі…</p>`}
  `);
}

/* ================= ФІНАЛ ================= */
function renderEnd(){
  setPhaseBadge(pub.result==='faithful'?'Клятва відновлена':'Безлад переміг', pub.result==='faithful'?'public':'danger');
  document.getElementById('roundLabel').textContent = 'Гру завершено';
  document.getElementById('treeWrap').innerHTML = renderTree(pub.result==='faithful'?100:0,44);
  const isHost = priv && priv.isHost;
  screen(`
    <div class="card" style="text-align:center;">${renderTree(pub.result==='faithful'?100:0,110)}</div>
    <h2 style="text-align:center;">${pub.result==='faithful' ? 'Клятва відновлена!' : 'Безлад переміг.'}</h2>
    ${witnessQuoteHtml(witnessSample(pub.result==='faithful'?'endRestored':'endChaos'))}
    ${sectionTtl('Хто ким був')}
    <div class="card">${pub.players.map(p=>`<div class="playerRow"><span class="sigilRow">${fullSigilPublicEnd(p)}<span>${esc(p.name)} ${!p.alive?'<span class="muted">(вигнаний(а))</span>':''}</span></span></div>`).join('')}</div>
    ${isHost? `<button class="act primary" onclick="socket.emit('newGameSameRoom')">Нова гра в цій кімнаті</button>` : `<p class="muted" style="text-align:center;">Хост може почати нову гру в цій кімнаті.</p>`}
    <button class="act" onclick="leaveRoom()">Вийти з кімнати</button>
  `);
}
function witnessSample(key){ return (({endRestored:['Уперше за довгий час чотири роди сказали правду одночасно.'],endChaos:["Слова знову розсипались, не долетівши одне до одного."]})[key]||['…'])[0]; }
function fullSigilPublicEnd(p){ return priv && p.id===priv.id ? fullSigil(p.name, priv.caste, 28) : neutralRune(p.name,28); }

/* ================= ГОЛОВНИЙ РЕНДЕР ================= */
function render(){
  checkVibeTriggers();
  if(!session || !pub){
    document.getElementById('topBar').style.display='none';
    if(uiScreen==='start') return renderStart();
    if(uiScreen==='rules') return renderRules();
    if(uiScreen==='createJoin') return renderCreateJoin();
    return renderStart();
  }
  document.getElementById('topBar').style.display='block';
  if(pub.phase==='lobby') return renderLobby();
  if(!priv) return; // приватний стан ще не прийшов
  if(pub.phase==='public') return renderPublic();
  if(pub.phase==='secret') return renderSecret();
  if(pub.phase==='reveal') return renderReveal();
  if(pub.phase==='invite') return renderInvite();
  if(pub.phase==='vote') return renderVote();
  if(pub.phase==='voteResult') return renderVoteResult();
  if(pub.phase==='end') return renderEnd();
}
setInterval(()=>{ if(pub && pub.phase==='lobby' && pub.regTimerEnd){ const el=document.getElementById('regTimerVal'); if(el) el.textContent = formatRegTimer(); } }, 1000);

render();
</script>
